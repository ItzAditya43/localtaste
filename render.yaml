services:
  - type: web
    name: localtaste
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
